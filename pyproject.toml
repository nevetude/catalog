[project]
name = "catalog"
version = "5.0.0"
description = "Movies & TV catalog"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
