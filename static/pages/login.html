<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Catalog</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <header class="header"></header>

  <div class="login-box">
    <h1>Account</h1>
    <label>Username</label>
    <input id="username" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <p id="authError" class="auth-error" hidden></p>
    <div class="row">
      <button class="btn-reset" id="btnRegister">Sign up</button>
      <button class="btn-apply" id="btnLogin">Log in</button>
    </div>
  </div>

  <script type="module" src="/static/js/pages/login.js"></script>
</body>
</html>
