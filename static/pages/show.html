<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show – Catalog</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <header class="header"></header>

  <div id="detailLoading" class="loading">Loading…</div>
  <div id="detailError" class="empty" hidden>Not found</div>
  <div id="detailRoot" class="detail-page" hidden></div>
  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>
    <div class="lb-stage">
      <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
      <img id="lbImg" alt="">
      <button type="button" class="lb-nav next" id="lbNext" aria-label="Next">›</button>
    </div>
  </div>

  <script type="module" src="/static/js/pages/detail.js"></script>
</body>
</html>
