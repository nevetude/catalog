<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Settings</title>
    <style>
        p,
        label {
            font: 1rem "Fira Sans", sans-serif;
        }

        /* 1. Стили для самой полосы (трека) */
input[type=range]::-webkit-slider-runnable-track {
  height: 8px;
  background: #d1d5db; /* Цвет неактивной части линии */
  border-radius: 4px;
}

        /* 2. Стили для бегунка (кругляшка) в Chrome, Safari, Edge, Opera */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;              /* Ширина бегунка */
            height: 20px;             /* Высота бегунка */
            border-radius: 50%;       /* Делаем его круглым */
            background: darkblue;     /* Цвет бегунка */
            cursor: pointer;          /* Меняем курсор при наведении */
        }

        /* 3. Стили для бегунка в Firefox (нужно дублировать) */
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: darkblue;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <p>Audio settings:</p>

    <div>
        <input type="range" id="volume" name="volume" min="0" max="11" />
        <label for="volume">Volume</label>
    </div>

    <div>
        <input type="range" id="cowbell" name="cowbell" min="0" max="100" value="90" step="10" />
        <label for="cowbell">Cowbell</label>
    </div>

</body>
</html>
